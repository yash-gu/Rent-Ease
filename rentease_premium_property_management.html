                                    <button className="flex flex-col items-center p-2 rounded-lg hover:bg-slate-50 transition-colors text-secondary"><span className="material-symbols-outlined text-xl">visibility</span><span className="text-[10px] font-black uppercase mt-1">View</span></button>
                                    <button className="flex flex-col items-center p-2 rounded-lg hover:bg-slate-50 transition-colors text-secondary"><span className="material-symbols-outlined text-xl">download</span><span className="text-[10px] font-black uppercase mt-1">Get</span></button>
                                    <button className="flex flex-col items-center p-2 rounded-lg hover:bg-slate-50 transition-colors text-secondary"><span className="material-symbols-outlined text-xl">share</span><span className="text-[10px] font-black uppercase mt-1">Share</span></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </main>
            </div>
        );

        const App = () => (
            <MemoryRouter>
                <Routes>
                    <Route path="/" element={<HomePage />} />
                    <Route path="/discovery" element={<DiscoveryPage />} />
                    <Route path="/property-details" element={<PropertyDetails />} />
                    <Route path="/checkout" element={<CheckoutPage />} />
                    <Route path="/tenant-dashboard" element={<TenantDashboard />} />
                    <Route path="/host-dashboard" element={<HostDashboard />} />
                    <Route path="/add-listing" element={<AddListingPage />} />
                    <Route path="/messages" element={<MessagesPage />} />
                    <Route path="/host-documents" element={<HostDocuments />} />
                </Routes>
            </MemoryRouter>
        );

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<App />);
    </script>
</body>
