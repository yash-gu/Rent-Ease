services:
  - type: web
    name: rentease-backend
    env: node
    plan: free
    rootDir: mernease/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rentease-db
          property: connectionString

databases:
  - name: rentease-db
    plan: free
